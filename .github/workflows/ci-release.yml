# Rolling native CI prerelease for dogfooding before a GitHub Release.
# Runs after a successful `build` on main (not PRs). Tag `ci` is rewritten
# each time; `releases/latest` is left pointing at real releases.
# Native binaries only — not nuget.org / Sleet.

name: ci-release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: ci-release
  # Do not cancel an in-flight publish: deleting the rolling `ci` release and
  # then being cancelled leaves an untagged draft that blocks the next create.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  VersionPrefix: 42.42.${{ github.run_number }}
  VersionLabel: ${{ github.event.workflow_run.head_sha || github.sha }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  NDX_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  native-aot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: native-aot-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 📦 pack
        shell: pwsh
        run: |
          dotnet pack src/ndx/ndx.csproj -c $env:Configuration -r ${{ matrix.rid }} -bl:"pack-${{ matrix.rid }}.binlog"
          $nupkg = @(Get-ChildItem bin -Filter "ndx.${{ matrix.rid }}.*.nupkg" | Where-Object Name -NotLike '*.symbols.nupkg')
          if ($nupkg.Count -ne 1) { throw "Expected one RID nupkg for ${{ matrix.rid }}, found $($nupkg.Count)." }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet run --project src/nativepack --no-launch-profile -c $env:Configuration -- $nupkg[0].FullName ${{ matrix.rid }} artifacts ci

      - name: 📤 artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.rid }}
          path: |
            artifacts/ndx-*.zip
            artifacts/ndx-*.tar.gz
            artifacts/ndx-*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.rid }}
          path: '*.binlog'

  publish:
    needs: native-aot
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: 📥 native
        uses: actions/download-artifact@v4
        with:
          pattern: native-aot-*
          path: native

      - name: 🚀 ci prerelease
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem native -Recurse -File | Where-Object {
            $_.Extension -in '.zip', '.sha256' -or $_.Name.EndsWith('.tar.gz')
          })
          $assets += Get-Item install.sh, install.ps1, uninstall.sh, uninstall.ps1
          if ($assets.Count -lt 3) {
            Get-ChildItem native -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            throw "No native archives, checksums, or install/uninstall scripts found to attach. Found $($assets.Count)."
          }

          Write-Host "Attaching $($assets.Count) files:"
          $assets | ForEach-Object { Write-Host "  $($_.FullName)" }

          # Looking up the rolling tag via /releases/tags misses untagged drafts.
          # Those still have tag_name=ci, so create 422s with "already exists".
          # Sweep every matching release by id, including drafts.
          function Delete-CiRelease {
            $ids = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "ci") | .id')
            foreach ($id in $ids) {
              if ([string]::IsNullOrWhiteSpace($id)) { continue }
              Write-Host "Deleting existing ci release id=$id"
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$id" | Out-Null
            }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/ci" 2>$null | Out-Null
            $global:LASTEXITCODE = 0
          }

          Delete-CiRelease

          $notes = @"
          Rolling native build from ``$env:NDX_SHA``. Not a release.

          Install: ``curl -fsSL https://github.com/$env:GITHUB_REPOSITORY/releases/download/ci/install.sh | NDX_VERSION=ci sh``

          Update: ``ndx --update ci``

          Uninstall: ``curl -fsSL https://github.com/$env:GITHUB_REPOSITORY/releases/download/ci/uninstall.sh | sh``
          "@

          # Create the tag/release with no files. Passing assets to `gh release create`
          # can succeed with an empty upload list; `gh release upload` is how
          # publish.yml actually attaches archives.
          $created = $false
          for ($attempt = 1; $attempt -le 8; $attempt++) {
            gh release create ci --prerelease --latest=false --title CI --target $env:NDX_SHA --notes $notes
            if ($LASTEXITCODE -eq 0) { $created = $true; break }
            Write-Host "ci tag still present (attempt $attempt); retrying..."
            Start-Sleep -Seconds ($attempt * 3)
            Delete-CiRelease
          }
          if (-not $created) { throw "gh release create ci failed after 8 attempts" }

          gh release upload ci @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload ci failed" }

          $published = gh release view ci --json assets | ConvertFrom-Json
          $names = @($published.assets.name)
          Write-Host "Published $($names.Count) assets: $($names -join ', ')"
          if ($names.Count -lt 3) {
            throw "Expected archives on the ci release, found $($names.Count)."
          }
