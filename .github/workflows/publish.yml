# Builds Native AOT binaries for the RID matrix and attaches
# archives + SHA256 checksums + install/uninstall scripts to the GitHub Release.
# glibc linux archives are also copied as *-gnu.tar.gz (Webi). musl RIDs are
# packed in an Alpine SDK container and published both as release assets and
# as NuGet RID packages (ndx.linux-musl-x64 / ndx.linux-musl-arm64).
# Also packs RID-specific plus `any` nupkgs and the top-level pointer, then
# pushes runtime nupkgs before the pointer to nuget.org on a stable release
# (Trusted Publishing / GitHub Actions OIDC) and to Sleet.
# After a stable release is published, submits a Devlooped.ndx update to WinGet.

name: publish
on:
  release:
    types: [prereleased, released]

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  VersionLabel: refs/tags/${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  SLEET_FEED_URL: ${{ vars.SLEET_FEED_URL }}

jobs:
  native-aot:
    # Rolling `ci` prereleases are produced by ci-release.yml. This
    # workflow is for versioned GitHub Releases only; `refs/tags/ci`
    # is not a valid Version and restore fails with MSB4181.
    if: github.event.release.tag_name != 'ci'
    name: native-aot-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: ubuntu-latest
            rid: linux-musl-x64
            musl: true
          - os: ubuntu-24.04-arm
            rid: linux-musl-arm64
            musl: true
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        if: matrix.musl != true
        uses: devlooped/actions-dotnet-env@v1

      - name: 📦 pack
        if: matrix.musl != true
        shell: pwsh
        run: |
          $version = '${{ github.event.release.tag_name }}' -replace '^v',''
          dotnet pack src/ndx/ndx.csproj -c $env:Configuration -r ${{ matrix.rid }} -bl:"pack-${{ matrix.rid }}.binlog"
          $nupkg = @(Get-ChildItem bin -Filter "ndx.${{ matrix.rid }}.*.nupkg" | Where-Object Name -NotLike '*.symbols.nupkg')
          if ($nupkg.Count -ne 1) { throw "Expected one RID nupkg for ${{ matrix.rid }}, found $($nupkg.Count)." }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet run --project src/nativepack --no-launch-profile -c $env:Configuration -- $nupkg[0].FullName ${{ matrix.rid }} artifacts $version

      - name: 📦 pack musl
        if: matrix.musl == true
        shell: bash
        run: |
          version='${{ github.event.release.tag_name }}'
          version="${version#v}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/src \
            -w /src \
            -e Configuration \
            -e VersionLabel \
            -e GITHUB_RUN_NUMBER \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine3.23-aot \
            sh .github/scripts/pack-musl.sh '${{ matrix.rid }}' "$version"

      - name: 📤 artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.rid }}
          path: |
            artifacts/ndx-*.zip
            artifacts/ndx-*.tar.gz
            artifacts/ndx-*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: bin/*.${{ matrix.rid }}.*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs-${{ matrix.rid }}
          path: '*.binlog'

  publish:
    needs: native-aot
    if: github.event.release.tag_name != 'ci'
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    permissions:
      contents: write
    env:
      SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        shell: pwsh
        run: dnx --yes retest -- --no-build

      - name: 📦 pointer
        shell: pwsh
        run: |
          dotnet pack src/ndx/ndx.csproj -c $env:Configuration -bl:pointer-pack.binlog

      - name: 📦 fallback
        shell: pwsh
        run: |
          dotnet pack src/ndx/ndx.csproj -c $env:Configuration -r any -bl:any-pack.binlog

      - name: 📤 package
        uses: actions/upload-artifact@v4
        with:
          name: package-any
          path: bin/*.nupkg
          retention-days: 30
          if-no-files-found: error

      - name: 📥 packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: bin
          merge-multiple: true

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs
          path: '*.binlog'

      - name: 📥 native
        uses: actions/download-artifact@v4
        with:
          pattern: native-aot-*
          path: native

      - name: 📤 archives
        uses: actions/upload-artifact@v4
        with:
          name: native-archives
          path: |
            native/**/*.zip
            native/**/*.tar.gz
            native/**/*.sha256
            install.sh
            install.ps1
            uninstall.sh
            uninstall.ps1
          if-no-files-found: error

      - name: 🚀 release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          $assets = @(Get-ChildItem native -Recurse -File | Where-Object {
            $_.Extension -in '.zip', '.sha256' -or $_.Name.EndsWith('.tar.gz')
          })
          $assets += Get-Item install.sh, install.ps1, uninstall.sh, uninstall.ps1
          if ($assets.Count -eq 0) { throw 'No native archives, checksums, or install/uninstall scripts found to attach.' }
          gh release upload "${{ github.event.release.tag_name }}" @($assets.FullName) --clobber

      - name: 🚀 sleet
        if: env.SLEET_CONNECTION != ''
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem bin -Filter *.nupkg | Where-Object Name -NotLike '*.symbols.nupkg' | Sort-Object Name)
          $runtimePackagePattern = '^ndx\.(win-x64|win-arm64|linux-x64|linux-arm64|linux-musl-x64|linux-musl-arm64|osx-x64|osx-arm64|any)\..+\.nupkg$'
          $runtimePackages = @($packages | Where-Object Name -Match $runtimePackagePattern)
          $pointerPackages = @($packages | Where-Object Name -NotMatch $runtimePackagePattern)

          if ($runtimePackages.Count -eq 0) { throw 'No RID-specific or fallback packages found.' }
          if ($pointerPackages.Count -eq 0) { throw 'No top-level pointer package found.' }

          $runtimePath = Join-Path $env:RUNNER_TEMP runtime-packages
          $pointerPath = Join-Path $env:RUNNER_TEMP pointer-package
          New-Item -ItemType Directory -Force -Path $runtimePath, $pointerPath | Out-Null

          Copy-Item -Path $runtimePackages.FullName -Destination $runtimePath
          Copy-Item -Path $pointerPackages.FullName -Destination $pointerPath

          $sleetVersion = $null
          if ($env:SLEET_FEED_URL) {
            $sleetVersion = (Invoke-RestMethod -Uri $env:SLEET_FEED_URL).'sleet:version'
          }
          if ($sleetVersion) {
            dotnet tool update sleet -g --allow-downgrade --version $sleetVersion
          } else {
            dotnet tool update sleet -g --allow-downgrade
          }

          sleet push $runtimePath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"
          sleet push $pointerPath --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=$env:SLEET_CONNECTION" -p "SLEET_FEED_TYPE=azure"

  # Stable releases only. Prereleases do not publish to nuget.org.
  # This job is the only one allowed to request a GitHub OIDC token.
  # It does not read a long-lived NuGet API key.
  #
  # Create this policy on https://www.nuget.org/account/trustedpublishing before the next
  # stable release. Package owner below is the account that owns the packages.
  # NuGet/login user is vars.NUGET_USER, or secrets.NUGET_USER when the
  # variable is empty. The verified policy creator username is kzu. Package
  # owner remains Devlooped. nuget.org rejects token exchange for an
  # organization username, so this is kzu and not Devlooped.
  #   Package owner: Devlooped
  #   Repository owner: devlooped
  #   Repository: ndx
  #   Workflow file: publish.yml
  #   Environment: nuget
  #   Scope: Push only new package versions
  #   Leave Unlist and Stage unchecked.
  #   Glob patterns and packages, one exact ID per line (no wildcard):
  #     ndx
  #     ndx.any
  #     ndx.win-x64
  #     ndx.win-arm64
  #     ndx.linux-x64
  #     ndx.linux-arm64
  #     ndx.linux-musl-x64
  #     ndx.linux-musl-arm64
  #     ndx.osx-x64
  #     ndx.osx-arm64
  # GitHub environment name must be nuget, the same value as the policy.
  # Do not remove or weaken required reviewers, wait timers, or branch/tag rules
  # on an existing environment. A release run's GITHUB_REF is refs/tags/<tag_name>.
  # A deployment branch/tag rule must allow that tag ref or this job does not start.
  # Protected branches only does not allow these tag releases.
  # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#release
  # https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments#deployment-branches-and-tags
  # https://github.com/NuGet/login
  nuget:
    needs: publish
    if: github.event.action == 'released' && github.event.release.tag_name != 'ci'
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    environment: nuget
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 📥 packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: bin
          merge-multiple: true

      - name: 🔑 nuget login
        id: login
        uses: NuGet/login@v1
        with:
          # Verified policy creator username kzu. Not an email and not Devlooped.
          user: ${{ vars.NUGET_OIDC || secrets.NUGET_OIDC }}

      - name: 🚀 nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem bin -Filter *.nupkg | Where-Object Name -NotLike '*.symbols.nupkg' | Sort-Object Name)
          $runtimePackagePattern = '^ndx\.(win-x64|win-arm64|linux-x64|linux-arm64|linux-musl-x64|linux-musl-arm64|osx-x64|osx-arm64|any)\..+\.nupkg$'
          $runtimePackages = @($packages | Where-Object Name -Match $runtimePackagePattern)
          $pointerPackages = @($packages | Where-Object Name -NotMatch $runtimePackagePattern)

          if ($runtimePackages.Count -eq 0) { throw 'No RID-specific or fallback packages found.' }
          if ($pointerPackages.Count -eq 0) { throw 'No top-level pointer package found.' }

          foreach ($package in $runtimePackages) {
            dotnet nuget push $package.FullName -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY --skip-duplicate
          }

          foreach ($package in $pointerPackages) {
            dotnet nuget push $package.FullName -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY --skip-duplicate
          }

  winget:
    needs: [publish, nuget]
    if: github.event.action == 'released' && github.event.release.tag_name != 'ci'
    runs-on: ubuntu-latest
    steps:
      # Runs after publish has attached the Windows zips.
      # winget-releaser forwards `token` to Komac as GITHUB_TOKEN.
      # The value is the GH_TOKEN secret, which can open the winget-pkgs pull request.
      - name: 🚀 winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Devlooped.ndx
          installers-regex: 'ndx-.+-win-.+\.zip$'
          token: ${{ secrets.GH_TOKEN }}
